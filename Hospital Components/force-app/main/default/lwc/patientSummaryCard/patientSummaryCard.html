<template>
    <lightning-card
        title="Patient 360 Summary"
        icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <div class="patient-header">

                <div class="patient-header-content">
                    <div class="patient-avatar">
                        <lightning-icon
                            icon-name="standard:contact"
                            alternative-text="Patient"
                            size="medium">
                        </lightning-icon>
                    </div>
                    <div class="patient-main-info">

                        <div class="patient-name-row">
                            <h1>{patientName}</h1>

                            <span class="status-badge">
                                <span class="status-dot"></span>
                                {status}
                            </span>
                        </div>

                        <p class="uhid">
                            UHID: {uhid}
                        </p>
                    </div>
                </div>
            </div>
            <div class="section-header">
                <div class="section-title">
                    <lightning-icon
                        icon-name="utility:user"
                        alternative-text="Patient Information"
                        size="x-small">
                    </lightning-icon>
                    <span>Patient Information</span>
                </div>
            </div>
            <div class="slds-grid slds-wrap info-grid">
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <lightning-icon
                                icon-name="utility:user"
                                size="x-small"
                                alternative-text="Age">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Age</p>
                            <p class="info-value">{age}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <lightning-icon
                                icon-name="utility:people"
                                size="x-small"
                                alternative-text="Gender">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Gender</p>
                            <p class="info-value">{gender}</p>
                        </div>

                    </div>
                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon blood-icon">
                            <lightning-icon
                                icon-name="utility:heart"
                                size="x-small"
                                alternative-text="Blood Group">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Blood Group</p>
                            <p class="info-value">{bloodGroup}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <lightning-icon
                                icon-name="utility:event"
                                size="x-small"
                                alternative-text="Registration Date">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Registration Date</p>
                            <p class="info-value">{registrationDate}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon doctor-icon">
                            <lightning-icon
                                icon-name="standard:people"
                                size="x-small"
                                alternative-text="Doctor">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Treating Doctor</p>
                            <p class="info-value">{doctorName}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">
                    <div class="info-item">
                        <div class="info-icon">
                            <lightning-icon
                                icon-name="standard:account"
                                size="x-small"
                                alternative-text="Hospital">
                            </lightning-icon>
                        </div>
                        <div>
                            <p class="info-label">Hospital Name</p>
                            <p class="info-value">{hospitalName}</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="section-header appointment-section">
                <div class="section-title">
                    <lightning-icon
                        icon-name="utility:event"
                        alternative-text="Appointment"
                        size="x-small">
                    </lightning-icon>
                    <span>Appointment Information</span>
                </div>
            </div>
            <div class="slds-grid slds-wrap info-grid">
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">

                    <div class="info-item">

                        <div class="info-icon">
                            <lightning-icon
                                icon-name="utility:number_input"
                                size="x-small"
                                alternative-text="Appointment Number">
                            </lightning-icon>
                        </div>

                        <div>
                            <p class="info-label">Appointment No.</p>
                            <p class="info-value">{appointmentNo}</p>
                        </div>

                    </div>

                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">

                    <div class="info-item">

                        <div class="info-icon">
                            <lightning-icon
                                icon-name="utility:event"
                                size="x-small"
                                alternative-text="Appointment Date">
                            </lightning-icon>
                        </div>

                        <div>
                            <p class="info-label">Appointment Date</p>
                            <p class="info-value">{appointmentDate}</p>
                        </div>

                    </div>

                </div>
                <div class="slds-size_1-of-2 slds-medium-size_1-of-3">

                    <div class="info-item diagnosis-card">

                        <div class="info-icon diagnosis-icon">
                            <lightning-icon
                                icon-name="utility:warning"
                                size="x-small"
                                alternative-text="Diagnosis">
                            </lightning-icon>
                        </div>

                        <div>
                            <p class="info-label">Diagnosis</p>
                            <p class="info-value diagnosis">
                                {diagnosis}
                            </p>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </lightning-card>
</template>
